apis:
  - aid: alcohol-and-tobacco-tax-and-trade-bureau:ttb-open-data-api
    name: TTB Open Data
    tags:
      - Open Data
      - Excise Tax
      - Statistics
      - DCAT-US
    humanURL: https://www.ttb.gov/data
    baseURL: https://www.ttb.gov
    description: >-
      TTB's open data surface is a set of static, anonymously downloadable files rather than a
      request/response API. Production and operations reports for beer, wine, distilled spirits
      and tobacco are published as JSON and CSV under /system/files/<YYYY-MM>/, and two
      processing-time feeds are refreshed daily as XML and CSV under /images/foia/. There is no
      OpenAPI, no query API, no API key and no rate limit; format is selected by choosing a
      different file, not by content negotiation. Dataset metadata is published in Project Open
      Data / DCAT-US 1.1 form inside the Department of the Treasury catalog, where 34 records
      carry publisher.name "TTB".
    x-base-url-note: >-
      TTB states no API base URL because it ships no API. www.ttb.gov is the host that actually
      serves every machine-readable file; the two prefixes in use are /system/files/<YYYY-MM>/
      for bulk datasets and /images/foia/ for the daily processing-time feeds.
    properties:
      - type: DataCatalog
        url: json-ld/alcohol-and-tobacco-tax-and-trade-bureau-dcat-us.jsonld
      - type: Documentation
        url: https://www.ttb.gov/statistics/reports-and-data
      - type: DataFeed
        name: Label application processing times (XML, daily)
        url: https://www.ttb.gov/images/foia/cola_stats.xml
      - type: DataFeed
        name: Beverage alcohol formula processing times (CSV, daily)
        url: https://www.ttb.gov/images/foia/form_stats.csv
      - type: DataFeed
        name: Tobacco products production and operations (JSON)
        url: https://www.ttb.gov/system/files/2024-08/Tobacco_Products_Data.json
      - type: DataFeed
        name: Beer national report (JSON)
        url: https://www.ttb.gov/system/files/2025-05/Beer_National_Report_JSON.json
      - type: DataFeed
        name: Wine data (JSON)
        url: https://www.ttb.gov/system/files/2024-08/Wine_Data.json
      - type: DataFeed
        name: Distilled spirits data (JSON)
        url: https://www.ttb.gov/system/files/2024-08/Distilled_Spirits_Data.json

  - aid: alcohol-and-tobacco-tax-and-trade-bureau:ttb-cola-registry
    name: TTB Public COLA Registry
    tags:
      - Alcohol Beverage Labels
      - COLA
      - Open Data
      - Lookup
    humanURL: https://www.ttb.gov/regulated-commodities/labeling/cola-public-registry
    baseURL: https://www.ttbonline.gov/colasonline/
    description: >-
      The Public COLA Registry holds every approved, expired, surrendered or revoked Certificate
      of Label Approval (TTB F 5100.31) for wine, distilled spirits and malt beverages. It needs
      no registration or password. It is also the only parameterised, addressable lookup TTB
      documents anywhere: GET publicSearchColasBasic.do?action=publicDisplaySearchBasic&ttbid=
      followed by a 14-character TTB ID returns that COLA's detail page. The response is
      rendered HTML rather than JSON or XML, so a machine consumer must scrape it.
    properties:
      - type: Lookup
        name: COLA detail by TTB ID
        url: https://www.ttbonline.gov/colasonline/publicSearchColasBasic.do?action=publicDisplaySearchBasic&ttbid=
      - type: Documentation
        url: https://www.ttb.gov/regulated-commodities/labeling/cola-public-registry

  - aid: alcohol-and-tobacco-tax-and-trade-bureau:ttb-permits-online
    name: TTB Permits Online (PONL)
    tags:
      - Permits
      - Licensing
      - Alcohol
      - Tobacco
    humanURL: https://www.ttb.gov/online-services/ponl/permits-online-help
    baseURL: https://www.ttbonline.gov/permitsonline/
    description: >-
      Permits Online is the electronic system for applying for and maintaining federal basic
      permits, brewer's notices, distilled spirits plant registrations and tobacco permits.
      There is no fee at the federal level to apply. It is an authenticated web application
      entered through a form login with a registered TTB.gov account; it exposes no API, no
      token endpoint and no programmatic interface. Its only open-data output is the daily
      permit application processing-time statistic published on ttb.gov.
    properties:
      - type: Application
        url: https://www.ttbonline.gov/permitsonline/
      - type: Documentation
        url: https://www.ttb.gov/online-services/ponl/permits-online-help
      - type: DataFeed
        name: Permit application processing times
        url: https://www.ttb.gov/nrc/statistics-original-applications-to-operate

