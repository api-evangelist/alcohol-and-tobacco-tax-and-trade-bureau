description: >-
  TTB publishes no plans and charges nothing for data access. This file REPLACES a 2026-05-04
  bulk-sweep scaffold that invented Free / Professional / Enterprise tiers with monthly quotas,
  overage pricing, SLA targets and a dedicated account manager. TTB is a U.S. federal bureau:
  its open data is a public good released into the public domain, and its transactional
  services are free at the federal level by statute. There is no pricing page to point at
  because there is no price.
