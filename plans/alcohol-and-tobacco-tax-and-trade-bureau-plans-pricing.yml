    "license": "https://creativecommons.org/publicdomain/zero/1.0/" and
    "accessLevel": "public".
  detail: >-
    All TTB open data (statistical reports, processing-time feeds, COLA registry lookups) is
    free and anonymous. Separately, TTB states there is no fee at the federal level to apply
    for or maintain approval to operate a TTB-regulated alcohol or tobacco business through
    Permits Online — so even the transactional side carries no charge. Federal excise tax
    itself is a statutory liability, not a plan.
  paid_tiers: false
  enterprise_contact_only: false
