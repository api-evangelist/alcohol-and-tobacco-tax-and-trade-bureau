note: >-
  TTB publishes no OpenAPI, GraphQL, AsyncAPI, gRPC or WSDL contract, so every contract-level
  standard below is asserted false on evidence rather than left unknown. The one standard TTB
  genuinely conforms to is the U.S. federal open-data metadata standard: 34 TTB-published
  dataset records appear in the Department of the Treasury Project Open Data / DCAT-US 1.1
  catalog with publisher.name "TTB". No published compliance program (SOC 2, ISO 27001,
  FedRAMP) was found on any TTB surface, so no Compliance pointer is emitted.
standards:
  - id: project-open-data-1.1
    name: Project Open Data Metadata Schema v1.1 (DCAT-US)
    conforms: true
    domain_standard: true
    sector: government
    evidence: >-
      34 dataset records with "publisher": {"name": "TTB", "subOrganizationOf": {"name":
      "Department of the Treasury"}} in https://www.treasury.gov/data.json (HTTP 200,
      502,658 bytes, fetched 2026-09-01). Catalog declares
      conformsTo https://project-open-data.cio.gov/v1.1/schema and
      @context https://project-open-data.cio.gov/v1.1/schema/catalog.jsonld.
      Records carry the full required POD element set: identifier (015-TTB-*),
      accessLevel, bureauCode (015:13), programCode (015:027), contactPoint,
      accrualPeriodicity, distribution[] and license.
    evidence_url: https://www.treasury.gov/data.json
    artifact: json-ld/alcohol-and-tobacco-tax-and-trade-bureau-dcat-us.jsonld
  - id: dcat
    name: W3C Data Catalog Vocabulary (DCAT)
    conforms: true
    evidence: >-
      TTB dataset records are typed dcat:Dataset with dcat:Distribution children inside the
      Treasury dcat:Catalog; DCAT-US 1.1 is the federal profile of DCAT.
    evidence_url: https://www.treasury.gov/data.json
  - id: cc0-1.0
    name: Creative Commons CC0 1.0 Public Domain Dedication
    conforms: true
    evidence: >-
