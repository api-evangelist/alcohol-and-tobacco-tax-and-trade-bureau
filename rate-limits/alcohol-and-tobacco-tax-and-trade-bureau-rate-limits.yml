source: >-
  https://www.ttb.gov/data ; live unauthenticated responses from
  https://www.ttb.gov/images/foia/cola_stats.xml and
  https://www.ttb.gov/system/files/2024-08/Tobacco_Products_Data.json, probed 2026-09-01
